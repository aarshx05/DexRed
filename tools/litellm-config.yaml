model_list:
  # ── Cloud models (Anthropic) ──
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Local models (Ollama via SSH tunnel) ──
  # On VM: ssh -N -R 11434:127.0.0.1:11434 azureuser@VM_IP
  - model_name: coder-fast
    litellm_params:
      model: ollama/coder-fast
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          extra_body:
        options:
          num_ctx: 32768

  - model_name: coder
    litellm_params:
      model: ollama/coder
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          num_ctx: 16384

  - model_name: reason
    litellm_params:
      model: ollama/reason
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          num_ctx: 16384

  - model_name: huihui_ai/qwen2.5-coder-abliterate:7b
    litellm_params:
      model: ollama/huihui_ai/qwen2.5-coder-abliterate:7b
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          num_ctx: 16384

  - model_name: huihui_ai/qwen2.5-coder-abliterate:3b
    litellm_params:
      model: ollama/huihui_ai/qwen2.5-coder-abliterate:3b
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          num_ctx: 32768

  - model_name: mannix/llama3.1-8b-abliterated
    litellm_params:
      model: ollama/mannix/llama3.1-8b-abliterated
      api_base: http://127.0.0.1:11435
      api_key: "ollama"
      extra_body:
        options:
          num_ctx: 16384

litellm_settings:
  drop_params: true
  cache: false
  num_retries: 2
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
