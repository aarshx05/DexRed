# CodexSec Model Configuration — Google Gemini via OpenRouter
# Copy this to ~/.codex/config.toml or merge with existing config.
#
# Prerequisites:
#   1. Get an OpenRouter API key at https://openrouter.ai/keys
#   2. Set: export OPENROUTER_API_KEY="sk-or-..."
#
# Alternative: Use GCP Vertex AI directly (built-in provider "gcp")
# with GOOGLE_APPLICATION_CREDENTIALS set.

model = "google/gemini-2.5-pro"
model_provider = "openrouter"

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

# Other Gemini models:
# model = "google/gemini-2.5-flash"
# model = "google/gemini-2.0-flash"
